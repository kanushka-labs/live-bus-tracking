openapi: 3.0.3
info:
  title: Fleet API
  version: 0.1.0
  description: Buses, GPS devices, routes, stops and live positions for the bus tracking system.
servers:
  - url: /
security:
  - oauth2: []
paths:
  /buses:
    get:
      operationId: listBuses
      summary: Every registered bus
      security:
        - oauth2: [fleet:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of buses
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching buses }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Bus' } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: registerBus
      summary: Register a bus
      security:
        - oauth2: [fleet:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBus' }
      responses:
        '201': { description: bus registered, content: { application/json: { schema: { $ref: '#/components/schemas/Bus' } } } }
        '400': { description: invalid bus, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /buses/{busId}:
    patch:
      operationId: updateBus
      summary: Update a bus's active status or route assignment
      security:
        - oauth2: [fleet:manage]
      parameters:
        - { name: busId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusUpdate' }
      responses:
        '200': { description: bus updated, content: { application/json: { schema: { $ref: '#/components/schemas/Bus' } } } }
        '400': { description: invalid update, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: bus not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /routes:
    get:
      operationId: listRoutes
      summary: Every route and its ordered stops
      security:
        - oauth2: [fleet:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of routes
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching routes }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Route' } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: createRoute
      summary: Define a route as an ordered sequence of named, located stops
      security:
        - oauth2: [fleet:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRoute' }
      responses:
        '201': { description: route created, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '400': { description: invalid route, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /routes/{routeId}:
    patch:
      operationId: updateRoute
      summary: Update a route's name or stops
      security:
        - oauth2: [fleet:manage]
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRoute' }
      responses:
        '200': { description: route updated, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '400': { description: invalid route, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: route not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /devices:
    get:
      operationId: listDevices
      summary: Every registered GPS device, including its last-update time
      security:
        - oauth2: [devices:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of devices
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching devices }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: registerDevice
      summary: Register a GPS device, issuing its ID and secret, and assign it to a bus
      security:
        - oauth2: [devices:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDevice' }
      responses:
        '201': { description: device registered, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCredentials' } } } }
        '400': { description: invalid device, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /devices/{deviceId}:
    patch:
      operationId: updateDevice
      summary: Reassign a device to a different bus, or mark it active or inactive
      security:
        - oauth2: [devices:manage]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200': { description: device updated, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '400': { description: invalid update, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: device not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /bus-positions:
    get:
      operationId: listBusPositions
      summary: Every bus's current position and route, including offline buses at their last known position
      security:
        - oauth2: [positions:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of bus positions
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching buses }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/BusPosition' } }
        '401': { description: not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: missing scope, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /location-updates:
    post:
      operationId: submitLocationUpdate
      summary: A GPS device reports its bus's current position and the time it was taken
      description: >-
        Public at the gateway: a GPS device is not a Thunder-signed-in user, so
        no OAuth scope guards this route. The service itself authenticates the
        request by the deviceId/secret carried in the body, against the
        credentials issued at registration, and rejects an unrecognized or
        inactive device with 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '202': { description: location update accepted }
        '400': { description: malformed update, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: device ID unrecognized or marked inactive, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            fleet:read: Read bus, route and stop listings
            fleet:manage: Register buses, define routes and stops, assign a bus to a route
            devices:read: Read device records, including last-update time
            devices:manage: Register, reassign and deactivate a GPS device
            positions:read: Every bus's current position
  schemas:
    Bus:
      type: object
      required: [id, licensePlate, active]
      properties:
        id: { type: string }
        licensePlate: { type: string }
        active: { type: boolean }
        routeId: { type: string, nullable: true }
    NewBus:
      type: object
      required: [licensePlate]
      properties:
        licensePlate: { type: string }
    BusUpdate:
      type: object
      properties:
        active: { type: boolean }
        routeId: { type: string, nullable: true, description: route to assign; null clears the assignment }
    Route:
      type: object
      required: [id, name, stops]
      properties:
        id: { type: string }
        name: { type: string }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Stop' }
    NewRoute:
      type: object
      required: [name, stops]
      properties:
        name: { type: string }
        stops:
          type: array
          items: { $ref: '#/components/schemas/Stop' }
    Stop:
      type: object
      required: [name, sequence, lat, lng]
      properties:
        name: { type: string }
        sequence: { type: integer, description: order of the stop along the route }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    Device:
      type: object
      required: [id, busId, active]
      properties:
        id: { type: string }
        busId: { type: string }
        active: { type: boolean }
        lastUpdateAt: { type: string, format: date-time, nullable: true, description: when this device's last location update arrived }
    NewDevice:
      type: object
      required: [busId]
      properties:
        busId: { type: string }
    DeviceCredentials:
      type: object
      required: [id, busId, active, secret]
      properties:
        id: { type: string }
        busId: { type: string }
        active: { type: boolean }
        secret: { type: string, description: shown once, at registration }
    DeviceUpdate:
      type: object
      properties:
        busId: { type: string, description: reassign the device to this bus }
        active: { type: boolean }
    BusPosition:
      type: object
      required: [busId, lat, lng, reportedAt, offline]
      properties:
        busId: { type: string }
        routeId: { type: string, nullable: true }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        reportedAt: { type: string, format: date-time }
        offline: { type: boolean, description: true when no update has arrived for over 2 minutes }
        deviceId: { type: string, description: present only for a caller holding devices:read }
    LocationUpdate:
      type: object
      required: [deviceId, secret, lat, lng, time]
      properties:
        deviceId: { type: string }
        secret: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        time: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
